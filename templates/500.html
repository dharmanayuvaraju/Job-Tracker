{% extends "base.html" %}

{% block title %}Server Error (500) - Job Tracker{% endblock %}

{% block content %}
<div class="card empty-state error-card">
    <div class="error-icon">⚠️</div>
    <h2>500 - Internal Server Error</h2>
    <p class="text-muted error-text">
        Something unexpected went wrong on our end. No sensitive details or stack traces are exposed.
    </p>
    <div class="error-actions">
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
        <a href="{{ url_for('index') }}" class="btn btn-outline">Home</a>
    </div>
</div>
{% endblock %}
