{% extends "base.html" %}

{% block title %}Log In - Job Tracker{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Log in to access your job applications.</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="auth-form" novalidate>
        <!-- CSRF token for security against cross-site request forgery -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="email">Email Address</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                value="{{ email or '' }}" 
                placeholder="you@example.com" 
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Enter your password" 
                required
            >
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <div class="auth-footer">
        <p>Don't have an account yet? <a href="{{ url_for('signup') }}">Sign up here</a></p>
    </div>
</div>
{% endblock %}
