{% extends "base.html" %}

{% block title %}Sign Up - Job Tracker{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <h2>Create an Account</h2>
        <p>Start tracking your job applications today.</p>
    </div>

    <form method="POST" action="{{ url_for('signup') }}" class="auth-form" novalidate>
        <!-- CSRF token for security against cross-site request forgery -->
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="username">Username</label>
            <input 
                type="text" 
                id="username" 
                name="username" 
                value="{{ username or '' }}" 
                placeholder="e.g. alex_coder" 
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                value="{{ email or '' }}" 
                placeholder="you@example.com" 
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Minimum 8 characters" 
                minlength="8" 
                required
            >
            <small class="form-help">Must be at least 8 characters long.</small>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input 
                type="password" 
                id="confirm_password" 
                name="confirm_password" 
                placeholder="Re-enter your password" 
                required
            >
        </div>

        <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
    </form>

    <div class="auth-footer">
        <p>Already have an account? <a href="{{ url_for('login') }}">Log in here</a></p>
    </div>
</div>
{% endblock %}
