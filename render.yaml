services:
  - type: web
    name: job-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt && flask init-db
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9

